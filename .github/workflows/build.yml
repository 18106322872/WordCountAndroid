name: Build WordCount APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 单任务：编译 APK。图片 OCR 用 Kotlin 层 Tesseract(tess-two)，
# 中文模型 chi_sim.traineddata 在 CI 内下载进 assets，随 APK 内置，完全离线。

# 允许默认 GITHUB_TOKEN 创建 Release（否则发布 APK 会 403）
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          components: 'platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Python 3.10 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Download Tesseract chi_sim traineddata into assets
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L -o app/src/main/assets/tessdata/chi_sim.traineddata \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata
          ls -lh app/src/main/assets/tessdata/

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: gradle assembleDebug

      - name: Rename APK to Wordcount.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Wordcount.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wordcount-apk
          path: app/build/outputs/apk/debug/Wordcount.apk

      # 重发前清理旧 release 与 tag，避免 app-debug.apk 残留、保证只留 wordcount.apk
      # 用 GitHub REST API（curl）可靠删除，不依赖 gh CLI
      - name: Remove stale release/tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/18106322872/WordCountAndroid/releases/tags/apk)
          RID=$(printf '%s' "$REL" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || true)
          if [ -n "$RID" ]; then
            echo "deleting release id=$RID"
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/18106322872/WordCountAndroid/releases/$RID
          fi
          curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/18106322872/WordCountAndroid/git/refs/tags/apk || true

      - name: Create GitHub Release (APK only)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: apk
          name: WordCount APK (latest)
          make_latest: true
          files: app/build/outputs/apk/debug/Wordcount.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
