name: Build WordCount APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ---- 打包 OCR 模型（折中方案：模型不放进 APK，运行时下载）----
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rapidocr and package models
        run: |
          pip install rapidocr_onnxruntime
          python - <<'PY'
          import os, glob, zipfile, shutil, site
          base = site.getsitepackages()[0]
          out = "ocr_models"
          if os.path.exists(out):
              shutil.rmtree(out)
          os.makedirs(out)
          mapping = {"det": "det", "rec": "rec", "cls": "cls"}
          count = 0
          for p in glob.glob(os.path.join(base, "rapidocr_onnxruntime", "**", "*.onnx"), recursive=True):
              name = os.path.basename(p).lower()
              folder = None
              for k in mapping:
                  if k in name:
                      folder = mapping[k]
                      break
              if folder is None:
                  continue
              dest = os.path.join(out, folder, os.path.basename(p))
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copy(p, dest)
              count += 1
          print("packaged", count, "model files")
          assert count >= 3, "未找到 OCR 模型文件"
          with zipfile.ZipFile("ocr_models.zip", "w", zipfile.ZIP_DEFLATED) as z:
              for f in glob.glob(out + "/**/*", recursive=True):
                  if os.path.isfile(f):
                      z.write(f, os.path.relpath(f, out))
          print("ocr_models.zip created")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ocr_models
          path: ocr_models.zip

  # ---- 编译 APK（无需本地 Android Studio）----
  apk:
    needs: model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          components: 'platform-tools'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: gradle assembleDebug

      - name: Download OCR model zip
        uses: actions/download-artifact@v4
        with:
          name: ocr_models
          path: .

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release (APK + model)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: models
          name: OCR Models & APK (latest)
          overwrite: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            ocr_models.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
