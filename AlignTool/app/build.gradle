plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.henry.aligntool'
    compileSdk 34

    defaultConfig {
        applicationId 'com.henry.aligntool'
        // minSdk 26：与 WordCountAndroid 一致；
        // 纯 XML 方案不依赖 POI/StAX，无需更高 SDK，26 已覆盖绝大多数在网 Android 设备。
        minSdk 26
        targetSdk 34
        versionCode 21
        // 手机版独立版本号（沿用跳过 4 与 7 的约定，与桌面版号不冲突）
        versionName '1.0.21'

        // 只编 arm64-v8a（现代手机），缩小体积、功能零影响
        ndk {
            abiFilters 'arm64-v8a'
        }

        manifestPlaceholders = [appName: 'Align Tool']
    }

    // 纯 XML 方案不再内嵌 Python/Chaquopy，故无需 useLegacyPackaging 的 jniLibs 兼容。
    packaging {
        // 资源冲突排除（纯 XML 仍可能带入 commons/kotlin 等重复文件）
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module',
                'META-INF/versions/**',
                'META-INF/*.RSA',
                'META-INF/*.SF',
                'META-INF/*.DSA',
                'META-INF/*.EC',
                // kotlinx-coroutines / android 资源
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'win32-x86-64/**',
                'win32-x86/**',
                'linux-x86-64/**'
            ]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        // 与 Kotlin 1.9.22 配套、且已验证可编译通过的组合（前 3 个 APK 即用此版本）。
        // 注意：androidx.compose.compiler 最高仅发布到 1.5.x（1.5.15 反而要求 Kotlin 1.9.25）。
        kotlinCompilerExtensionVersion '1.5.10'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // 提供 Android 框架层 Theme.Material3.*（含 colorSurface 等 attr），Compose 的 material3 不含框架主题
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // SAF：选两份文件 + 持久权限
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // FileProvider 分享（随 Compose BOM 已间接包含，但显式声明更稳）
    implementation 'androidx.core:core-ktx:1.13.1'
}
