org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
# v1.9.156: 启用 Jetifier —— 把旧 Support Library 依赖（com.github.barteksc:pdfium-android:1.9.0
#   内部引用的 android.support.v4.util.ArrayMap 等）在构建期重写到 androidx.*，修复真机
#   renderWithPdfium 构造 PdfiumCore 时抛 NoClassDefFoundError: android/support/v4/util/ArrayMap
#   导致 P403051 类 JPEG2000/JBIG2 扫描件无法渲染、OCR 全程失败的问题。
android.enableJetifier=true
android.nonTransitiveRClass=true
kotlin.code.style=official
